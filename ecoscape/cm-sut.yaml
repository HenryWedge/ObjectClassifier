---
apiVersion: v1
kind: ConfigMap
metadata:
  name: object-classifier-two-zone-sut
  namespace: default
data:
  01-topic-dog-input.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaTopic
    metadata:
      name: dog-input
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      partitions: 1
      replicas: 1
      config:
        retention.ms: 604800000
        segment.bytes: 1073741824

  02-topic-reporter.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaTopic
    metadata:
      name: reporter
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      partitions: 1
      replicas: 1
      config:
        retention.ms: 604800000
        segment.bytes: 1073741824

  03-edge-images-pvc.yaml: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: object-classifier-images
      namespace: object-classifier-two-zone-edge
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi

  04-consumer-deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: object-classifier-consumer
      namespace: object-classifier-two-zone-cloud
      labels:
        app: object-classifier-consumer
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: object-classifier-consumer
      template:
        metadata:
          labels:
            app: object-classifier-consumer
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "5001"
            prometheus.io/path: "/metrics"
        spec:
          containers:
            - name: consumer
              image: ecoscape/object-classifier-consumer
              imagePullPolicy: IfNotPresent
              env:
                - name: BOOTSTRAP_SERVER
                  value: "kafka-kafka-bootstrap.object-classifier-two-zone-cloud.svc.cluster.local:9092"
                - name: TOPICS
                  value: "dog-input"
                - name: REPORTER_TOPIC
                  value: "reporter"
                - name: GROUP_ID
                  value: "object-classifier-group"
                - name: MODEL_DEPTH
                  value: "50"
                - name: MAX_POLL_RECORDS
                  value: "20"
                - name: PYTHONUNBUFFERED
                  value: "1"
              ports:
                - name: metrics
                  containerPort: 5001
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "3Gi"

  05-consumer-service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: object-classifier-consumer
      namespace: object-classifier-two-zone-cloud
      labels:
        app: object-classifier-consumer
    spec:
      selector:
        app: object-classifier-consumer
      ports:
        - name: http
          port: 5001
          targetPort: 5001
