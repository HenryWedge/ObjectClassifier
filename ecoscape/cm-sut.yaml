---
apiVersion: v1
kind: ConfigMap
metadata:
  name: object-classifier-two-zone-sut
  namespace: default
data:
  01-kafka-nodepool-broker.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaNodePool
    metadata:
      name: broker-pool
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      replicas: 1
      roles:
        - broker
      resources:
        requests:
          cpu: "300m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
      storage:
        type: jbod
        volumes:
          - id: 0
            type: ephemeral
            kraftMetadata: shared

  02-kafka-nodepool-controller.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaNodePool
    metadata:
      name: controller-pool
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      replicas: 1
      roles:
        - controller
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "300m"
          memory: "768Mi"
      storage:
        type: jbod
        volumes:
          - id: 0
            type: ephemeral
            kraftMetadata: shared

  03-kafka.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: Kafka
    metadata:
      name: kafka
      namespace: object-classifier-two-zone-cloud
      annotations:
        strimzi.io/kraft: enabled
        strimzi.io/node-pools: enabled
    spec:
      kafka:
        version: "4.3.0"
        metadataVersion: "4.3-IV0"
        template:
          pod:
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
        listeners:
          - name: plain
            port: 9092
            type: internal
            tls: false
        config:
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
          default.replication.factor: 1
          min.insync.replicas: 1
          inter.broker.protocol.version: "4.3"
      entityOperator:
        topicOperator:
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
        userOperator:
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"

  04-topic-dog-input.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaTopic
    metadata:
      name: dog-input
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      partitions: 1
      replicas: 1
      config:
        retention.ms: 604800000
        segment.bytes: 1073741824

  05-topic-reporter.yaml: |
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaTopic
    metadata:
      name: reporter
      namespace: object-classifier-two-zone-cloud
      labels:
        strimzi.io/cluster: kafka
    spec:
      partitions: 1
      replicas: 1
      config:
        retention.ms: 604800000
        segment.bytes: 1073741824

  06-edge-images-pvc.yaml: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: object-classifier-images
      namespace: object-classifier-two-zone-edge
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi

  07-consumer-deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: object-classifier-consumer
      namespace: object-classifier-two-zone-cloud
      labels:
        app: object-classifier-consumer
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: object-classifier-consumer
      template:
        metadata:
          labels:
            app: object-classifier-consumer
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "5001"
            prometheus.io/path: "/metrics"
        spec:
          containers:
            - name: consumer
              image: ecoscape/object-classifier-consumer
              imagePullPolicy: IfNotPresent
              env:
                - name: BOOTSTRAP_SERVER
                  value: "kafka-kafka-bootstrap.object-classifier-two-zone-cloud.svc.cluster.local:9092"
                - name: TOPICS
                  value: "dog-input"
                - name: REPORTER_TOPIC
                  value: "reporter"
                - name: GROUP_ID
                  value: "object-classifier-group"
                - name: MODEL_DEPTH
                  value: "50"
                - name: MAX_POLL_RECORDS
                  value: "20"
                - name: PYTHONUNBUFFERED
                  value: "1"
              ports:
                - name: metrics
                  containerPort: 5001
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "3Gi"

  08-consumer-service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: object-classifier-consumer
      namespace: object-classifier-two-zone-cloud
      labels:
        app: object-classifier-consumer
    spec:
      selector:
        app: object-classifier-consumer
      ports:
        - name: http
          port: 5001
          targetPort: 5001
